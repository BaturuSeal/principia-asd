<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc"><title id="title">Principia ASD — from measurements to inspectable rules</title><desc id="desc">A scientific rule discovery workspace combining explicit tasks, multiple methods, and reproducible evidence.</desc><rect width="1120" height="300" rx="20" fill="#101c2c"/><circle cx="1030" cy="20" r="220" fill="#142b3d"/><circle cx="1030" cy="20" r="150" fill="none" stroke="#3cc4b5" stroke-opacity=".3"/><g font-family="system-ui, sans-serif"><text x="56" y="62" font-size="14" letter-spacing="4" fill="#7fd8ca">PRINCIPIA ASD / 1.0</text><text x="56" y="120" font-size="40" font-weight="600" fill="#f2f6fc">From measurements to inspectable rules.</text><text x="56" y="159" font-size="19" fill="#b7c9db">Choose the question. Explore the explanation. Keep the evidence.</text><g fill="#172e42" stroke="#315369"><rect x="56" y="207" width="260" height="49" rx="8"/><rect x="355" y="207" width="296" height="49" rx="8"/><rect x="690" y="207" width="340" height="49" rx="8"/></g><g fill="#dbe9f3" font-size="17"><text x="76" y="238">Measurements + task contracts</text><text x="375" y="238">Methods + adaptive rule search</text><text x="710" y="238">Frozen rules + deterministic assessment</text></g><g fill="#7fd8ca" font-size="23"><text x="327" y="239">→</text><text x="663" y="239">→</text></g></g></svg>
