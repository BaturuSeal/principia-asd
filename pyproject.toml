[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "principia-asd"
version = "1.0.0rc6"
description = "A compact, reproducible framework for scientific rule discovery"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "third-party-notices/*.txt"]
dependencies = ["numpy>=1.26", "scipy>=1.13", "scikit-learn>=1.4", "certifi>=2024.2"]

[project.optional-dependencies]
curation = ["h5py>=3.11,<4"]
science = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.13"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
principia-asd = "principia_asd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.setuptools.package-data]
principia_asd = ["web/*.html", "web/*.css", "web/*.js", "web/vendor/*"]
"principia_asd.catalog" = ["review_advisories.json"]
