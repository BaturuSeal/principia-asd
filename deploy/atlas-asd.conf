# Include inside the existing atlas.chipflow.net TLS server block.
location = /web/asd-test { return 308 /web/asd-test/; }
location ^~ /web/asd-test/api/ { return 404; }
location = /web/asd-test/api { return 404; }
location ^~ /web/asd-test/ {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    if ($uri ~ /\.) { return 404; }
    alias /data/pzq/Principia-ASD/current/public-site/;
    index index.html;
    autoindex off;
    disable_symlinks if_not_owner;
    client_max_body_size 1k;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Cache-Control "no-cache" always;
    access_log off;
}
