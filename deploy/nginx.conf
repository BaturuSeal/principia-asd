# Place inside nginx's http {} context. Serve only a verified static-site build.
# Terminate HTTPS in your existing proxy. Never proxy to the local companion.
server {
    listen 8080;
    server_name _;
    root /srv/principia-asd/site;
    index index.html;
    autoindex off;
    server_tokens off;
    client_max_body_size 1k;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # KaTeX creates inline layout styles; scripts and connections remain same-origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-cache" always;
    gzip on;
    gzip_types application/json application/javascript text/javascript text/css;
    gzip_vary on;

    location /api/ { return 404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
